<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces"
                xmlns:t="jakarta.faces.composite/telveComponents">

    <div class="card-body">
        <ui:insert name="content" />
    </div>

    <div class="card-footer #{telveConfigResolver.getProperty('telve.framework.showFooterButtons') ne 'true' ? 'invisible' : ''}">
        <h:form id="actionButtons">
            <div class="pull-right">

                <ui:insert name="extraButtons" />
                <p:commandButton id="edit" 
                                 value="#{messages['general.button.Edit']}"
                                 action="#{bean.edit()}"
                                 icon="fa fa-edit" 
                                 partialSubmit="true"
                                 process="@this"
                                 ajax="true"
                                 styleClass="btn-warning"
                                 rendered="#{bean.hasUpdatePermission() and hideEditBtn ne 'true' }"/>
                <p:commandButton id="done" 
                                 value="#{messages['general.button.Close']}"
                                 action="#{bean.close()}"
                                 icon="ui-icon-close" 
                                 partialSubmit="true"
                                 process="@this"
                                 ajax="true"/>
            </div>
        </h:form>
    </div>


</ui:composition>
