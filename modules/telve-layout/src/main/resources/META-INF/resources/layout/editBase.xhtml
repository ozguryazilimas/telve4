<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces"
                template="#{themeManager.layoutTemplate}">

    <ui:define name="outerspace" >
        <ui:insert name="includes" />
    </ui:define>


    <ui:define name="body">

        <ui:include src="/layout/messages.xhtml"/>


        <div class="card card-outline card-primary">
            <h:form id="form" class="editForm">
                <p:focus context="form"/>
                
                <div class="card-body">
                    <ui:insert name="form" />
                </div>

                <div class="card-footer #{telveConfigResolver.getProperty('telve.framework.showFooterButtons') ne 'true' ? 'invisible' : ''}">
                    <div class="row">
                        <div class="col-xs-12" >

                            <ui:insert name="extraButtons" />


                            <ui:fragment rendered="#{not hideStdButtons}">
                                <div class="pull-right">
                                    <p:commandButton id="save" 
                                                     value="#{messages['general.button.Save']}" 
                                                     action="#{homeBean.save()}"
                                                     rendered="#{not hideSave and (( not empty entity.id and homeBean.hasUpdatePermission()) or ( empty entity.id and homeBean.hasInsertPermission()))}"
                                                     ajax="true"
                                                     process="@form"
                                                     validateClient="true"
                                                     styleClass="btn-success"
                                                     icon="fa fa-save" />  

                                    <p:commandButton id="delete" 
                                                     value="#{messages['general.button.Delete']}" 
                                                     action="#{homeBean.delete()}"
                                                     rendered="#{not hideDelete and not empty entity.id and homeBean.hasDeletePermission() }"
                                                     validateClient="true"
                                                     styleClass="btn-danger"
                                                     icon="fa fa-trash">
                                        <p:confirm header="#{messages['general.caption.Confirm']}" message="#{messages['general.message.confirm.Delete']}" icon="fa fa-2x fa-exclamation-triangle btn-delete" />
                                    </p:commandButton>

                                    <p:commandButton id="done" 
                                                     value="#{messages['general.button.Close']}"
                                                     action="#{homeBean.close()}"
                                                     icon="ui-icon-close" 
                                                     partialSubmit="true"
                                                     process="@this"
                                                     ajax="true"/>
                                </div>
                            </ui:fragment>
                        </div>
                    </div>
                </div>
            </h:form>
        </div>

    </ui:define>
    
    <ui:define name="context-menu">
        <li class="nav-item">
            <p:commandLink title="#{messages['general.button.Save']}" onclick="jQuery('#form\\:save').click();return false;"
                           rendered="#{not hideSave and (( not empty entity.id and homeBean.hasUpdatePermission()) or ( empty entity.id and homeBean.hasInsertPermission()))}" styleClass="context-command nav-link">
                <i class="fa fa-save"></i>
                <h:outputText value=" #{messages['general.button.Save']}" />
            </p:commandLink>
        </li>
        <li class="nav-item">
            <p:commandLink title="#{messages['general.button.Delete']}" action="#{homeBean.delete()}" rendered="#{not hideDelete and not empty entity.id and homeBean.hasDeletePermission() }" styleClass="context-command nav-link">
                <i class="fa fa-trash-o"></i>
                <h:outputText value=" #{messages['general.button.Delete']}" />
                <p:confirm header="#{messages['general.caption.Confirm']}" message="#{messages['general.message.confirm.Delete']}" icon="fa fa-2x fa-exclamation-triangle btn-delete" />
            </p:commandLink>
        </li>
    </ui:define>
    
    <ui:define name="context-menu-right">
        <li class="nav-item">
            <p:commandLink action="#{homeBean.close()}" title="#{messages['general.button.Close']}" styleClass="context-command nav-link">
                <i class="fa fa-close"></i>
                <h:outputText value=" #{messages['general.button.Close']}" styleClass="visible-xs-inline"/>
            </p:commandLink>
        </li>
    </ui:define>
</ui:composition>
