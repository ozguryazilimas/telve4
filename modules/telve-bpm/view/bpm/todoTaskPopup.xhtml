<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces"
                xmlns:t="jakarta.faces.composite/telveComponents"
                template="/layout/taskBase.xhtml">

    <ui:param name="title" value="todoTaskPopup.label.Title" />
    <ui:param name="bean" value="#{todoTask}" />

    <ui:define name="taskForm">
        <div class="row">
            <t:outputText label="general.label.Subject" value="#{todoTask.subject}" columnClass="col-xs-12" />
            <t:inputTextarea label="general.label.Info" value="#{todoTask.info}" maxlength="255" required="false" columnClass="col-xs-12" readonly="true"/>
            <t:outputDateTime label="general.label.BeginDate" value="#{todoTask.startDate}" />
            <t:outputDateTime label="general.label.EndDate" value="#{todoTask.endDate}" />
        </div>
    </ui:define>
</ui:composition>
