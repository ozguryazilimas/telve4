<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:c="jakarta.tags.core"
                xmlns:p="primefaces"
                xmlns:t="jakarta.faces.composite/telveComponents"
                template="/layout/processBase.xhtml">

    <ui:param name="title" value="todoTaskPopup.label.Title" />
    <ui:param name="bean" value="#{todoProcess}" />

    <ui:define name="taskForm">
        <div class="row">
            <t:inputText label="general.label.Subject" value="#{todoProcess.subject}" required="true" columnClass="col-xs-12"/>
            <t:inputTextarea label="general.label.Info" value="#{todoProcess.info}" required="false" maxlength="255" columnClass="col-xs-12"/>
            <t:inputDateTime label="general.label.BeginDate" value="#{todoProcess.startDate}" />
            <t:inputDateTime label="general.label.EndDate" value="#{todoProcess.endDate}" />
        </div>
    </ui:define>
</ui:composition>
