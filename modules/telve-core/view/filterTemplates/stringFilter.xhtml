<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces">


            <div>
                <h:outputText value="#{messages[filter.labelKey]}" style="" />
            </div>

            <p:selectOneMenu id="strOp#{idprefix}" value="#{filter.operand}" styleClass="mb-1" >
                <f:selectItems value="#{filter.operands}" var="operand"
                               itemLabel="#{messages['filter.operand.type.'.concat( operand )]}"/>
                <p:ajax update="strInput#{idprefix}" partialSubmit="true" process="@this" />
            </p:selectOneMenu>


            <h:panelGroup id="strInput#{idprefix}" layout="block" styleClass="mb-1">
                <p:inputText id="strINP#{idprefix}" value="#{filter.value}"
                             title="#{messages[filter.hintKey]}"
                             rendered="#{filter.operand ne 'All'}" />
            </h:panelGroup>



</ui:composition>
