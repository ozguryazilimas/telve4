<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:f="jakarta.faces.core"
              xmlns:h="jakarta.faces.html"
              xmlns:p="primefaces"
              xmlns:composite="jakarta.faces.composite">


    <composite:interface>
        <composite:attribute name="value" required="true"/>
        <composite:attribute name="label" required="false"/>        
        <composite:attribute name="feature" required="false" default="true"/>
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.value ne null}">
            
            <li>
                <div class="text-sm text-muted">#{messages[cc.attrs.label]}</div>
                <div>
                    <p:commandLink id="#{cc.id}_inp" action="#{featureLinkController.go(cc.attrs.value.featureName, cc.attrs.value.id )}" 
                           title="#{messages[cc.attrs.value.caption]}"
                           process="@this" ajax="true" partialSubmit="true">
                        <i class="#{cc.attrs.value.icon} margin-r-5" /><h:outputText value="#{cc.attrs.value.businessKey}" />
                    </p:commandLink>
                </div>
            </li>
        </ui:fragment>
    </composite:implementation>

</ui:component>
