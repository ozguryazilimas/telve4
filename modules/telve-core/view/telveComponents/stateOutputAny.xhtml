<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:f="jakarta.faces.core"
              xmlns:h="jakarta.faces.html"
              xmlns:p="primefaces"
              xmlns:composite="jakarta.faces.composite">


    <composite:interface>
        <composite:attribute name="label" required="false"/>        
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.rendered}">
            
            <li>
                <div class="text-sm text-muted">#{messages[cc.attrs.label]}</div>
                <div>
                    <composite:insertChildren />
                </div>
            </li>
        </ui:fragment>
    </composite:implementation>

</ui:component>
